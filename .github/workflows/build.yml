          project: ${{ vars.DEPOT_PROJECT }}
          token: ${{ secrets.DEPOT_TOKEN }}

      - name: Build machine-emulator docker image
        uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
        with:
          file: Dockerfile
          context: .
          platforms: linux/amd64
          tags: ${{ github.repository_owner }}/machine-emulator:devel
          push: false
          load: true
          build-args: |
            DEBUG=${{ (startsWith(github.ref, 'refs/tags/v') && 'no' || 'yes') }}
            GIT_COMMIT=${GITHUB_SHA}
            MACHINE_EMULATOR_VERSION=${{ env.MACHINE_EMULATOR_VERSION }}
          project: ${{ vars.DEPOT_PROJECT }}
          token: ${{ secrets.DEPOT_TOKEN }}

      - name: Build machine-emulator "tests" docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          file: tests/Dockerfile
          context: .
          platforms: linux/amd64
          tags: ${{ github.repository_owner }}/machine-emulator:tests
          push: false
          load: true
          build-args: |
            DEBUG=${{ (startsWith(github.ref, 'refs/tags/v') && 'no' || 'yes') }}
            MACHINE_EMULATOR_VERSION=${{ env.MACHINE_EMULATOR_VERSION }}

      - name: Generate sp1 fixtures
        # Mirrors sp1/Makefile's fixtures target through the tests image (no built
        # emulator on the runner). The machine-tests logs are recorded because
        # record-adversarial-machine.lua tampers one of them as its base.
        run: |
          mkdir -p sp1/test/fixtures/cartesi-machine-tests sp1/test/fixtures/one-mcycle
          chmod -R 777 sp1/test/fixtures
          docker run --rm -t -v ${{ github.workspace }}/sp1/test/fixtures:/fixtures ${{ github.repository_owner }}/machine-emulator:tests \
            cartesi-machine-tests --jobs=$(nproc) --hash-function=sha256 --save-step-logs=/fixtures/cartesi-machine-tests run_step
          docker run --rm -t -v ${{ github.workspace }}/sp1/test/fixtures:/fixtures ${{ github.repository_owner }}/machine-emulator:tests \
            /usr/share/cartesi-machine/tests/lua/record-one-mcycle.lua --hash-function=sha256 --output-dir=/fixtures/one-mcycle
          docker run --rm -t -v ${{ github.workspace }}/sp1/test/fixtures:/fixtures ${{ github.repository_owner }}/machine-emulator:tests \
            /usr/share/cartesi-machine/tests/lua/record-adversarial-machine.lua --fixtures-dir=/fixtures --output-dir=/fixtures/reject-machine
          ls sp1/test/fixtures/one-mcycle sp1/test/fixtures/reject-machine

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          # sp1-sdk 6.3.1 declares rust-version 1.88; pinned to the toolchain the
          # committed Cargo.lock was built with.
          toolchain: 1.93.1
          override: true
          components: rustfmt

      - name: Check Rust formatting
        run: make -C sp1/rust check-format

      - name: Install SP1 C toolchain and zkevm SDK
        # Pins must match sp1/cpp/Dockerfile (tag, checksums, lld version) —
        # the reproducibility step below fails if the two builds disagree.
        # lld links the guest; libmpc3/libmpfr6/libgmp10 are cc1plus runtime
        # dependencies the toolchain tarball ships without.
        # protobuf-compiler/libprotobuf-dev are host-build dependencies:
        # sp1-prover-types compiles .proto files via prost-build.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "lld=1:18.0-59~exp2" \
            libmpc3 libmpfr6 libgmp10 protobuf-compiler libprotobuf-dev
          mkdir -p $HOME/.sp1 && cd $HOME/.sp1
          curl -sSL -o toolchain.tar.gz \
            https://github.com/succinctlabs/riscv-gnu-toolchain/releases/download/2026.02.13/riscv64im-linux-amd64.tar.gz
          echo "7294ee279f52a75b0ad669fff60277d52e520b2b5fd7065c8264ac1ad93c1334  toolchain.tar.gz" | sha256sum -c -
          mkdir -p riscv64im-2026.02.13
          tar xzf toolchain.tar.gz -C riscv64im-2026.02.13 --strip-components=1
          curl -sSL -o zkevm-sdk.tar.gz \
            https://github.com/succinctlabs/sp1/releases/download/v6.3.1/zkevm-sdk-v6.3.1.tar.gz
          echo "ef9124009aa88a5039f003bda51fc5210888cc6aa878320aac04666a3389bfb8  zkevm-sdk.tar.gz" | sha256sum -c -
          mkdir -p zkevm-sdk-v6.3.1
          tar xzf zkevm-sdk.tar.gz -C zkevm-sdk-v6.3.1 --strip-components=1
          rm toolchain.tar.gz zkevm-sdk.tar.gz

      - name: Build interpret-jump-table.hpp
        # -t omitted so the redirected stdout is not corrupted by a tty.
        run: docker run --rm -v .:/this-dir ${{ github.repository_owner }}/machine-emulator:tests /this-dir/tools/gen-interpret-jump-table.lua > src/interpret-jump-table.hpp

      - name: Build SP1 guests
        run: make -C sp1/cpp guest.elf sha-abi-guest.elf

      - name: Check guest reproducibility against the canonical Docker build
        # Two independent environments (runner-native toolchain+lld, and the
        # pinned Docker image) must produce the same stripped guest byte for
        # byte. A mismatch means toolchain or linker drift reached the vkey.
        run: |
          docker build -f sp1/cpp/Dockerfile -t cartesi-sp1-guest .
          docker run --rm cartesi-sp1-guest cat /out/guest.elf > /tmp/guest-docker.elf
          sha256sum sp1/cpp/guest.elf /tmp/guest-docker.elf
          cmp sp1/cpp/guest.elf /tmp/guest-docker.elf

      - name: Run SP1 host tests
        run: make -C sp1/rust test

      - name: Install Foundry
        # Pinned to the same forge version as the other jobs.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.0.0

      - name: Generate Groth16 seal (CPU prover)
        # The experiment this job exists for: prove the one-mcycle fixture to a
        # contract-ready seal on a GitHub runner. Downloads ~8 GB of circuit
        # artifacts on first prove; the gnark stage runs in the sp1-gnark
        # container, native amd64 here.
        run: |
          free -h
          time make -C sp1 seal
          free -h

      - name: Run on-chain tests (Sepolia fork)
        run: make -C sp1 test-solidity

      - name: Export SP1 artifacts
        run: make -C sp1/rust export-artifacts

      - name: Upload SP1 artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sp1-artifacts
          path: |
            sp1/artifacts/guest.elf
            sp1/artifacts/vkey-hash.txt
            sp1/solidity/test/fixtures/seal.bin

  solidity-step:
    name: Solidity Step
    needs: [check-format, check-commits]
    runs-on: ubuntu-latest-8-cores
    steps:
      - name: Checkout machine emulator source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      # The transpiler drift check and its golden tests need only lua + lpeg + forge (no built
      # emulator), so they run first and fail fast before the expensive image build below.
      - name: Install lua5.4 and lpeg
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.4 lua-lpeg
          lua5.4 -e 'require("lpeg")'

      - name: Install Foundry
        # forge is pinned: fmt output and the check-gen-transpiled drift check below must match
        # the version that generated the committed .sol files.
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1.7.0
        with:
          version: v1.0.0

      - name: Check transpiled Solidity is in sync with the C++ sources
        run: make -C solidity-step check-gen-transpiled

      - name: Transpiler golden tests
        run: make -C solidity-step test-transpile

      - name: Setup variables
        run: echo MACHINE_EMULATOR_VERSION=`make version` >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Depot CLI
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

      - name: Build machine-emulator "builder" docker image
        uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
        with:
          file: Dockerfile
          context: .
          target: builder
          platforms: linux/amd64
          tags: ${{ github.repository_owner }}/machine-emulator:builder
          push: false
          load: true
          build-args: |
            DEBUG=${{ (startsWith(github.ref, 'refs/tags/v') && 'no' || 'yes') }}
            GIT_COMMIT=${GITHUB_SHA}
            MACHINE_EMULATOR_VERSION=${{ env.MACHINE_EMULATOR_VERSION }}
          project: ${{ vars.DEPOT_PROJECT }}
          token: ${{ secrets.DEPOT_TOKEN }}

      # tests/Dockerfile's runtime stage is FROM cartesi/machine-emulator:devel, so build it too.
      - name: Build machine-emulator docker image
        uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1.17.0
        with:
          file: Dockerfile
          context: .
          platforms: linux/amd64
          tags: ${{ github.repository_owner }}/machine-emulator:devel
          push: false
          load: true
          build-args: |
            DEBUG=${{ (startsWith(github.ref, 'refs/tags/v') && 'no' || 'yes') }}
            GIT_COMMIT=${GITHUB_SHA}
            MACHINE_EMULATOR_VERSION=${{ env.MACHINE_EMULATOR_VERSION }}
          project: ${{ vars.DEPOT_PROJECT }}
          token: ${{ secrets.DEPOT_TOKEN }}

      - name: Build machine-emulator "tests" docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          file: tests/Dockerfile
          context: .
          platforms: linux/amd64
          tags: ${{ github.repository_owner }}/machine-emulator:tests
          push: false
          load: true
          build-args: |
            DEBUG=${{ (startsWith(github.ref, 'refs/tags/v') && 'no' || 'yes') }}
            MACHINE_EMULATOR_VERSION=${{ env.MACHINE_EMULATOR_VERSION }}

      # check-gen-constants reads the live cartesi Lua module, so the generator runs INSIDE the tests
      # image (no built emulator on the runner); forge fmt + the diff run on the runner. -t is omitted
      # so the container's stdout redirects to the file uncorrupted, and forge fmt runs from
      # solidity-step/ so it picks up that project's [fmt] config (matching how the file was generated).
      - name: Check emulator constants are in sync with the C++ headers
        run: |
          docker run --rm -v ${{ github.workspace }}:/work:ro -w /work ${{ github.repository_owner }}/machine-emulator:tests \
            lua5.4 solidity-step/tools/gen-emulator-constants.lua > /tmp/EmulatorConstants.gen.sol
          cd solidity-step
          forge fmt /tmp/EmulatorConstants.gen.sol
          diff -u src/EmulatorConstants.sol /tmp/EmulatorConstants.gen.sol \
            || { echo "ERROR: src/EmulatorConstants.sol is stale. Run 'make -C solidity-step gen-constants' and commit."; exit 1; }

      - name: Generate solidity-step fixtures
        run: |
          FIX=solidity-step/test/fixtures
          mkdir -p $FIX/uarch-tests-per-cycle $FIX/uarch-solidity-scope $FIX/send-cmio-response $FIX/reset-uarch
          chmod -R 777 $FIX
          IMG=${{ github.repository_owner }}/machine-emulator:tests
          # uarch-riscv-tests is the installed wrapper (it bakes CARTESI_TESTS_UARCH_PATH); the
          # record-*.lua recorders are run directly (executable, with a lua5.4 shebang). Mirrors
          # solidity-step/Makefile's fixtures target; adversarial recorders tamper the positive sets.
          docker run --rm -t -v ${{ github.workspace }}/$FIX:/fixtures $IMG \
            uarch-riscv-tests --test='rv64ui%-uarch%-.+%.bin' --per-cycle-logs --output-dir=/fixtures/uarch-tests-per-cycle record_uarch_tests
          docker run --rm -t -v ${{ github.workspace }}/$FIX:/fixtures $IMG \
            /usr/share/cartesi-machine/tests/lua/record-solidity-uarch-scope.lua --output-dir=/fixtures/uarch-solidity-scope
          docker run --rm -t -v ${{ github.workspace }}/$FIX:/fixtures $IMG \
            /usr/share/cartesi-machine/tests/lua/record-send-cmio-response.lua --output-dir=/fixtures/send-cmio-response
          docker run --rm -t -v ${{ github.workspace }}/$FIX:/fixtures $IMG \
            /usr/share/cartesi-machine/tests/lua/record-reset-uarch.lua --output-dir=/fixtures/reset-uarch
          docker run --rm -t -v ${{ github.workspace }}/$FIX:/fixtures $IMG \
            /usr/share/cartesi-machine/tests/lua/record-adversarial-uarch.lua --fixtures-dir=/fixtures --output-dir=/fixtures/reject-uarch
          docker run --rm -t -v ${{ github.workspace }}/$FIX:/fixtures $IMG \
            /usr/share/cartesi-machine/tests/lua/record-adversarial-send-cmio-response.lua --fixtures-dir=/fixtures --output-dir=/fixtures/reject-send-cmio-response
          ls -lR $FIX

      - name: Run solidity-step tests
        run: make -C solidity-step test

      # Gas report is informational: it records the whole-mcycle champion logs (worst
      # mcycles by cycle count and by page count; see tools/record-mcycle.lua) and
      # prints verification gas, worst case first, into the job summary so cost
      # regressions and improvements are visible per run. Never gates the job.
      - name: Solidity-step gas report
        continue-on-error: true
        run: |
          FIX=solidity-step/test/fixtures
          IMG=${{ github.repository_owner }}/machine-emulator:tests
          TESTS=$(docker run --rm $IMG sh -c 'find /usr/share/cartesi-machine* -name rv64uc-v-rvc.bin | head -1 | xargs dirname')
          docker run --rm -t -v ${{ github.workspace }}/$FIX:/fixtures -v ${{ github.workspace }}/solidity-step/tools:/gastools $IMG \
            lua5.4 /gastools/record-mcycle.lua $TESTS/rv64uc-v-rvc.bin 6527 /fixtures/worst-mcycle-rvc.log
          docker run --rm -t -v ${{ github.workspace }}/$FIX:/fixtures -v ${{ github.workspace }}/solidity-step/tools:/gastools $IMG \
            lua5.4 /gastools/record-mcycle.lua $TESTS/rv64ua-v-lrsc.bin 3791 /fixtures/worst-mcycle-pages.log
          make -C solidity-step gas-report | tee -a $GITHUB_STEP_SUMMARY

      # Coverage is informational and forge's --ir-minimum pass is slow, so it never gates the job.
      - name: Solidity-step coverage report
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          cd solidity-step
          forge coverage --ir-minimum --report summary --report lcov | tee coverage-summary.txt
          genhtml lcov.info --output-directory coverage-html --title "solidity-step coverage" --quiet || true

      - name: Upload solidity-step coverage
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: solidity-step-coverage
          path: |
            solidity-step/coverage-html
            solidity-step/coverage-summary.txt
            solidity-step/lcov.info
          if-no-files-found: warn
